version: "3.9"

services:
  # ─── PostgreSQL khusus MAJA ───────────────────────────────────────────
  maja-db:
    image: postgres:16-alpine
    container_name: maja-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: maja_db
      POSTGRES_USER: maja_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5433:5432"   # hanya localhost, tidak expose ke luar
    volumes:
      - maja_pgdata:/var/lib/postgresql/data
    networks:
      - maja_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maja_user -d maja_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis khusus MAJA (session, cache, rate-limit) ──────────────────
  maja-redis:
    image: redis:7-alpine
    container_name: maja-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6380:6379"   # port berbeda dari redis app lain (6379/7665)
    volumes:
      - maja_redis_data:/data
    networks:
      - maja_network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  maja_pgdata:
    driver: local
  maja_redis_data:
    driver: local

networks:
  maja_network:
    name: maja_network
    driver: bridge
